spring.application.name=groupproject

# Use in memory db if env vars aren't set
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Uses H2 locally, or postgres if in production
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.open-in-view=false
spring.session.jdbc.initialize-schema=always

booksprint.admin.email=${BOOKSPRINT_ADMIN_EMAIL:admin@booksprint.local}
booksprint.admin.password=${BOOKSPRINT_ADMIN_PASSWORD:AdminPass123}

