spring.application.name=groupproject
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/booksprint;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
booksprint.admin.email=${BOOKSPRINT_ADMIN_EMAIL:admin@booksprint.local}
booksprint.admin.password=${BOOKSPRINT_ADMIN_PASSWORD:AdminPass123}
