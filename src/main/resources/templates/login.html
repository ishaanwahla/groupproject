<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Booksprint</title>

    <link rel="stylesheet" th:href="@{/styles/base.css}">
    <link rel="stylesheet" th:href="@{/styles/auth.css}">
    <script src="/js/auth.js"></script>
</head>

<body>
    <header>
        <h2>Booksprint</h2>
    </header>

    <div class="container container-center">
        <main class="login-card">
            <h3>Welcome back</h3>
            <form class="login-form" action="/api/auth/login" th:object="${loginRequest}" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <p class="form-message form-error" th:if="${#fields.hasErrors('global')}" th:errors="*{global}"></p>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <div class="login-footer">
                <p>Don't have an account? <a href="/register">Sign up</a></p>
            </div>
        </main>
    </div>

</body>

</html>
