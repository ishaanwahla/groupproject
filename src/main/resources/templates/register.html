<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" th:href="@{/styles.css}">
    <script src="/js/auth.js"></script>
</head>

<body>
    <header>
        <h2>Booksprint</h2>
    </header>

    <div class="container container-center">
        <main class="login-card">
            <h3>Create Account</h3>
            <form class="login-form" action="/api/auth/register" th:object="${registerRequest}" method="POST">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}" required>
                    <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required>
                    <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" required>
                    <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <p class="form-message form-error" th:if="${#fields.hasErrors('global')}" th:errors="*{global}"></p>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>
            <div class="login-footer">
                <p>Already have an account? <a href="/login">Log in</a></p>
            </div>
        </main>
    </div>

</body>

</html>
