<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="styles.css">
    <script src="/js/auth.js"></script>
</head>

<body>
    <header>
        <h2>Booksprint</h2>
    </header>

    <div class="container container-center">
        <main class="login-card">
            <h3>Create Account</h3>

            <form class="login-form" action="/api/auth/register" method="POST">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <p class="form-message" style="color: red;" th:if="${#fields.hasErrors('${registerRequest.email}')}"
                    th:errors="${registerRequest.email}"></p>

                <p class="form-message" style="color: red;" th:if="${#fields.hasErrors('global')}"
                    th:errors="*{global}"></p>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>
            <div class="login-footer">
                <p>Already have an account? <a href="/login">Log in</a></p>
            </div>
        </main>
    </div>

</body>

</html>
