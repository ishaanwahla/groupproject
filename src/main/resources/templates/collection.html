<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Collection - Booksprint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/book-cards.css">
    <link rel="stylesheet" href="/styles/dialog.css">
    <script src="/js/menu.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/new-book.js"></script>
    <script src="/js/collection.js"></script>
</head>

<body>
    <header th:replace="~{fragments :: header}"></header>

    <div class="container">
        <aside th:replace="~{fragments :: left-sidebar}"></aside>

        <main>
            <h2>My Collection</h2>
            <p id="collectionStatus" aria-live="polite">Loading collection...</p>
            <div id="collectionBooks" class="example-books collection-books"></div>
            <div class="collection-discover">
                <p>Looking for more?</p>
                <a href="/discover">Discover</a>
            </div>
        </main>
    </div>
    <dialog th:replace="~{fragments :: new-book-dialog}"></dialog>
</body>

</html>
