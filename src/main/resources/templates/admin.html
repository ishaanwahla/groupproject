<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Booksprint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="/js/admin.js"></script>
    <script src="/js/auth.js"></script>
</head>

<body>
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h2><i class="fa-solid fa-book"></i> Booksprint Admin</h2>
        <a class="btn-account" href="/login" data-logout-link>Log Out</a>
    </header>

    <p id="statusMessage" class="admin-status"></p>

    <div class="container admin-container">
        <aside class="left-sidebar admin-user-panel">
            <input type="text" id="searchBox" placeholder="Search by name or email">
            <h4 class="user-list-heading">Users</h4>
            <ul id="userList" class="user-list"></ul>
        </aside>
    </div>
</body>

</html>
