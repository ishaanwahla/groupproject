<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Booksprint</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Booksprint Admin</h2>
        <a href="/" class="btn-account">Back to app</a>
    </header>

    <p id="statusMessage" class="admin-status"></p>

    <div class="container">
        <aside class="left-sidebar admin-user-panel">
            <input type="text" id="searchBox" placeholder="Search by name or email">
            <h4 class="user-list-heading">Users</h4>
            <ul id="userList" class="user-list"></ul>
        </aside>

        <main>
            <div class="user-name-display" id="userNameDisplay">Select a user to view their details</div>

            <div class="user-metadata-card" id="userMetadata" style="display: none;">
                <p><strong>Email:</strong> <span id="metaEmail"></span></p>
                <p><strong>Account Created:</strong> <span id="metaCreatedAt"></span></p>
                <p><strong>Last Active:</strong> <span>N/A</span></p>
                <p><strong>Total API Requests:</strong> <span>N/A</span></p>
                <p><strong>Global WPM:</strong> <span>N/A</span></p>
                <p><strong>Global Accuracy:</strong> <span>N/A</span></p>
            </div>
        </main>
    </div>

    <script>
        let users = [];
        let selectedId = null;

        function renderList(rows) {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            for (const user of rows) {
                const item = document.createElement('li');
                const link = document.createElement('a');
                link.href = '#';
                link.textContent = user.name;
                link.className = 'user-list-item' + (user.id === selectedId ? ' active' : '');
                link.addEventListener('click', function (event) {
                    event.preventDefault();
                    selectedId = user.id;
                    renderList(rows);
                    showDetails(user);
                });
                item.appendChild(link);
                list.appendChild(item);
            }
        }

        function showDetails(user) {
            document.getElementById('userNameDisplay').textContent = user.name;
            document.getElementById('metaEmail').textContent = user.email;
            document.getElementById('metaCreatedAt').textContent = user.createdAt;
            document.getElementById('userMetadata').style.display = 'block';
        }

        fetch('/api/admin/users')
            .then(response => {
                if (!response.ok) {
                    throw new Error('You must be logged in as an admin to view this page.');
                }
                return response.json();
            })
            .then(data => {
                users = data;
                renderList(users);
            })
            .catch(error => {
                document.getElementById('statusMessage').textContent = error.message;
            });

        document.getElementById('searchBox').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            const filtered = users.filter(user =>
                user.name.toLowerCase().includes(query) || user.email.toLowerCase().includes(query)
            );
            renderList(filtered);
        });
    </script>
</body>
</html>
