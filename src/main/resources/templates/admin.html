<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Booksprint</title>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Booksprint Admin</h2>
        <a href="/">Back to app</a>
    </header>

    <p id="statusMessage"></p>

    <input type="text" id="searchBox" placeholder="Search by name or email">

    <table id="userTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Joined</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
        </tbody>
    </table>

    <link rel="stylesheet" href="styles.css">

    <script>
        let users = [];

        function renderRows(rows) {
            const body = document.getElementById('userTableBody');
            body.innerHTML = '';
            for (const user of rows) {
                const row = document.createElement('tr');
                row.innerHTML = '<td>' + user.name + '</td>' +
                    '<td>' + user.email + '</td>' +
                    '<td>' + user.role + '</td>' +
                    '<td>' + user.createdAt + '</td>';
                body.appendChild(row);
            }
        }

        fetch('/api/admin/users')
            .then(response => {
                if (!response.ok) {
                    throw new Error('You must be logged in as an admin to view this page.');
                }
                return response.json();
            })
            .then(data => {
                users = data;
                renderRows(users);
            })
            .catch(error => {
                document.getElementById('statusMessage').textContent = error.message;
            });

        document.getElementById('searchBox').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            const filtered = users.filter(user =>
                user.name.toLowerCase().includes(query) || user.email.toLowerCase().includes(query)
            );
            renderRows(filtered);
        });
    </script>
</body>
</html>
