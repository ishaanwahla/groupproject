<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksprint</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/book-cards.css">
    <link rel="stylesheet" href="/styles/dialog.css">
    <link rel="stylesheet" href="/styles/typing.css">
    <link rel="stylesheet" href="/styles/keyboard.css">
    <script type="module" src="/js/typing/typing.js"></script>
    <script type="module" src="/js/favorite.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/new-book.js"></script>
    <script src="/js/discover.js"></script>
</head>

<body>
    <header th:replace="~{fragments :: header}"></header>

    <div class="container">
        <aside th:replace="~{fragments :: left-sidebar}"></aside>

        <main>
            <div id="user-stats">
                <div id="wpm-display"><i class="fa-solid fa-stopwatch"></i> WPM: <span id="wpm-value">0</span></div>
                <div id="accuracy-display"><i class="fa-solid fa-bullseye"></i> Accuracy: <span
                        id="accuracy-value">100</span>%</div>
                <div id="time-display"><i class="fa-solid fa-hourglass-half"></i> Time: <span
                        id="time-value">--:--</span></div>
            </div>
            <div id="typing-wrapper">
                <div id="typing-interface">
                    <div id="chunk-container"></div>
                </div>
                <div th:insert="~{session-select :: session-select}"></div>
            </div>
            <div id="pause-indicator">Press ESC to Resume</div>
            <div id="pause-instructions">Press ESC to Pause</div>
            <div id="keyboard"></div>

            <div class="section-heading">
                <h3>More like this</h3>
                <a th:href="@{/discover}">See more</a>
            </div>
            <p class="recommendation-status">Loading recommendations...</p>
            <div class="example-books discover-books recommendation-books"></div>
        </main>
        <aside class="right-sidebar">
            <p class="book-name">No book selected</p>
            <p class="author-name">Author: -</p>
            <div class="current-book-cover" aria-hidden="true"></div>
            <div class="progress-circle">
                <span class="progress-text">0%</span>
            </div>
            <button class="favorite-button" type="button"><i class="fa-solid fa-star"></i> Favorite</button>
        </aside>
    </div>

    <dialog th:replace="~{fragments :: new-book-dialog}"></dialog>
    <dialog id="errorDialog" class="new-book-dialog">
        <form method="dialog"><button class="dialog-close"><i class="fa-solid fa-xmark"></i></button></form>
        <h2>Something went wrong</h2>
        <p id="errorDialogMessage"></p>
    </dialog>

</body>

</html>
