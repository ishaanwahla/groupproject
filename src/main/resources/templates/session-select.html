<div id="session-select-overlay" th:fragment="session-select">
    <div id="session-select-content">
        <p id="session-select-message">Ready to start?</p>

        <div class="session-select-row">
            <button type="button" class="session-preset-btn btn-primary" data-duration="300">5 min</button>
            <button type="button" class="session-preset-btn btn-primary" data-duration="600">10 min</button>
            <button type="button" class="session-preset-btn btn-primary" data-duration="1200">20 min</button>
        </div>

        <div class="session-select-row">
            <input type="number" id="custom-duration-input" min="1" max="300" placeholder="Minutes (1-300)">
            <button type="button" id="custom-duration-btn" class="btn-primary">Start</button>
        </div>

        <div class="session-select-row">
            <button type="button" id="endless-mode-btn" class="btn-secondary">Endless Mode</button>
        </div>
    </div>

    <div id="session-summary">
        <div class="session-summary-heading">
            <p>Session complete</p>
            <span id="summary-best-message"></span>
        </div>
        <div class="session-summary-stats">
            <div><strong id="summary-wpm">0</strong><span>WPM</span></div>
            <div><strong id="summary-accuracy">100%</strong><span>Accuracy</span></div>
            <div><strong id="summary-personal-best">0</strong><span>Personal best</span></div>
            <div><strong id="summary-mistakes">0</strong><span>Mistakes</span></div>
            <div><strong id="summary-words">0</strong><span>Words typed</span></div>
        </div>
        <div class="session-summary-details">
            <p>Correct keys: <strong id="summary-correct-keys">0</strong></p>
            <p>Most missed: <strong id="summary-missed-key">None</strong></p>
        </div>
        <div class="session-summary-actions">
            <button type="button" id="type-again-btn" class="btn-primary">Type again</button>
        </div>
    </div>
</div>
