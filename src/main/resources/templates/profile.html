<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Booksprint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/book-cards.css">
    <link rel="stylesheet" href="/styles/dialog.css">
    <link rel="stylesheet" href="/styles/profile.css">
    <script src="/js/menu.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/new-book.js"></script>
</head>

<body>
    <header th:replace="~{fragments :: header}"></header>

    <div class="container">
        <aside th:replace="~{fragments :: left-sidebar}"></aside>

        <main>
            <h2>Profile</h2>
            <div class="profile-card">
                <div class="profile-summary">
                    <div class="profile-user">
                        <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
                        <div>
                            <h2 th:text="${user.name}">Name</h2>
                            <p>Role: User</p>
                        </div>
                    </div>
                    <div class="profile-stats">
                        <div><strong th:text="${user.lastWpm != null ? user.lastWpm : '—'}">—</strong><span>Latest WPM</span></div>
                        <div><strong th:text="${user.lastAccuracy != null ? user.lastAccuracy + '%' : '—'}">—</strong><span>Latest accuracy</span></div>
                        <div><strong th:text="${user.bestWpm != null ? user.bestWpm : '—'}">—</strong><span>Personal best</span></div>
                        <div><strong th:text="${user.sessionsCompleted != null ? user.sessionsCompleted : 0}">0</strong><span>Sessions</span></div>
                    </div>
                </div>

                <h3>Typing Performance</h3>
                <div class="profile-charts">
                    <div class="profile-chart-card accuracy-card">
                        <h4>Latest Accuracy</h4>
                        <div class="accuracy-chart"
                            th:style="'--accuracy: ' + ${user.lastAccuracy != null ? user.lastAccuracy : 0} + '%'">
                            <div class="accuracy-chart-center">
                                <strong th:text="${user.lastAccuracy != null ? user.lastAccuracy + '%' : '—'}">—</strong>
                                <span>Accuracy</span>
                            </div>
                        </div>
                    </div>

                    <div class="profile-chart-card wpm-chart-card">
                        <h4>WPM Comparison</h4>
                        <div class="wpm-chart">
                            <div class="wpm-chart-row">
                                <span>Latest</span>
                                <div class="wpm-chart-track">
                                    <div class="wpm-chart-bar"
                                        th:style="'width: ' + ${user.lastWpm != null ? (user.bestWpm != null && user.bestWpm > user.lastWpm ? user.lastWpm * 100 / user.bestWpm : 100) : 0} + '%'">
                                    </div>
                                </div>
                                <strong th:text="${user.lastWpm != null ? user.lastWpm : '—'}">—</strong>
                            </div>
                            <div class="wpm-chart-row">
                                <span>Best</span>
                                <div class="wpm-chart-track">
                                    <div class="wpm-chart-bar personal-best-bar"
                                        th:style="'width: ' + ${user.bestWpm != null ? 100 : 0} + '%'">
                                    </div>
                                </div>
                                <strong th:text="${user.bestWpm != null ? user.bestWpm : '—'}">—</strong>
                            </div>
                        </div>
                    </div>
                </div>

                <h3>Favorite Books:</h3>
                <div class="example-books profile-favorites">
                    <div class="book">
                        <div class="book-info">
                            <h4>Book</h4>
                            <p>Author</p><button class="book-play" type="button"><i
                                    class="fa-solid fa-play"></i></button>
                        </div>
                        <div class="book-placeholder-image"></div>
                    </div>
                    <div class="book">
                        <div class="book-info">
                            <h4>Book</h4>
                            <p>Author</p><button class="book-play" type="button"><i
                                    class="fa-solid fa-play"></i></button>
                        </div>
                        <div class="book-placeholder-image"></div>
                    </div>
                    <div class="book">
                        <div class="book-info">
                            <h4>Book</h4>
                            <p>Author</p><button class="book-play" type="button"><i
                                    class="fa-solid fa-play"></i></button>
                        </div>
                        <div class="book-placeholder-image"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <dialog th:replace="~{fragments :: new-book-dialog}"></dialog>
</body>

</html>
