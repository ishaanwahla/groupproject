<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Booksprint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="/js/menu.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/new-book.js"></script>
</head>

<body>
    <header th:replace="~{fragments :: header}"></header>

    <div class="container">
        <aside th:replace="~{fragments :: left-sidebar}"></aside>

        <main>
            <h2>Profile</h2>
            <div class="profile-card">
            <div class="profile-summary">
                <div class="profile-user">
                    <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <h2 th:text="${user.name}">Name</h2>
                        <p>Role: User</p>
                    </div>
                </div>
                <div class="profile-stats">
                    <p>WPM: 50</p>
                    <p>Accuracy: 75%</p>
                </div>
            </div>

            <h3>Favorite Books:</h3>
            <div class="example-books profile-favorites">
                <div class="book"><div class="book-info"><h4>Book</h4><p>Author</p><button class="book-play" type="button"><i class="fa-solid fa-play"></i></button></div><div class="book-placeholder-image"></div></div>
                <div class="book"><div class="book-info"><h4>Book</h4><p>Author</p><button class="book-play" type="button"><i class="fa-solid fa-play"></i></button></div><div class="book-placeholder-image"></div></div>
                <div class="book"><div class="book-info"><h4>Book</h4><p>Author</p><button class="book-play" type="button"><i class="fa-solid fa-play"></i></button></div><div class="book-placeholder-image"></div></div>
            </div>
            </div>
        </main>
    </div>
    <dialog th:replace="~{fragments :: new-book-dialog}"></dialog>
</body>

</html>
